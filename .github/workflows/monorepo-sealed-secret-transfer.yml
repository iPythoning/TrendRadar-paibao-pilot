name: Sealed monorepo credential transfer
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  seal_0:
    if: ${{ github.event.pull_request.head.ref == 'migration/sealed-monorepo-radar-20261016' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CI_TEST_RUNNER && fromJSON(vars.CI_TEST_RUNNER) || (vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest') }}
    steps:
      - name: Prepare sealed-box runtime without source credentials
        shell: bash
        run: |
          if ! python3 -c 'import ctypes.util; raise SystemExit(0 if ctypes.util.find_library("sodium") else 1)'; then
            python3 -m pip install --disable-pip-version-check --quiet --target "$RUNNER_TEMP/monorepo-seal" 'PyNaCl==1.6.0'
          fi
      - name: Seal only the selected application credentials
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/monorepo-seal
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TRANSFER_0: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRANSFER_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_2: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          python3 - <<'PY'
          import base64,ctypes,ctypes.util,json,os
          batches = [{'environment': 'radar', 'key_id': '3380204578043523366', 'key': 'VmsRFiUDid152GO6GhM9p7IKzksUVVhzwqewlQTRnRI='}]
          names = ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_PROJECT_NAME']
          missing = [name for index,name in enumerate(names) if not os.environ.get('TRANSFER_'+str(index))]
          if missing:
              raise SystemExit('Required source secrets are unset: '+', '.join(missing))
          path = ctypes.util.find_library('sodium')
          if path:
              library=ctypes.CDLL(path)
              library.sodium_init()
              library.crypto_box_seal.argtypes=[ctypes.c_void_p,ctypes.c_void_p,ctypes.c_ulonglong,ctypes.c_void_p]
              library.crypto_box_seal.restype=ctypes.c_int
              def seal(value,public_key):
                  output=ctypes.create_string_buffer(len(value)+48)
                  message=ctypes.create_string_buffer(value)
                  public=ctypes.create_string_buffer(public_key)
                  if library.crypto_box_seal(output,message,len(value),public)!=0:
                      raise RuntimeError('Sealed-box encryption failed')
                  return output.raw
          else:
              from nacl.public import PublicKey,SealedBox
              def seal(value,public_key):
                  return SealedBox(PublicKey(public_key)).encrypt(value)
          records=[]
          for destination in batches:
              public_key=base64.b64decode(destination['key'])
              for index,name in enumerate(names):
                  value=os.environ.pop('TRANSFER_'+str(index)).encode() if len(batches)==1 else os.environ['TRANSFER_'+str(index)].encode()
                  records.append({'environment':destination['environment'],'name':name,'key_id':destination['key_id'],'encrypted_value':base64.b64encode(seal(value,public_key)).decode()})
          for index in range(len(names)):
              os.environ.pop('TRANSFER_'+str(index),None)
          envelope={'source_repository':'iPythoning/TrendRadar-paibao-pilot','source_sha':os.environ['SOURCE_SHA'],'batch_index':0,'records':records}
          print('SEALED_MONOREPO_TRANSFER:'+base64.b64encode(json.dumps(envelope,separators=(',',':')).encode()).decode())
          PY
